<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DOCX Viewer</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #eceef1; font: 15px "Segoe UI", sans-serif; color: #555; }
  [hidden] { display: none !important; }
  #hint { position: fixed; inset: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 16px; border: 2px dashed #c4c8cf; border-radius: 12px; }
  body.drag #hint { border-color: #2f6fde; }
  button { font: inherit; padding: 8px 18px; border: 0; border-radius: 6px; background: #2f6fde; color: #fff; cursor: pointer; }
  .docx-wrapper { background: #eceef1 !important; }
  .docx-wrapper > section.docx { box-shadow: 0 2px 12px rgba(0, 0, 0, .12) !important; }
  .docx sup, .docx sub { line-height: 0; }
  #loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 16px; background: #eceef1; }
  #loading::before { content: ""; width: 40px; height: 40px; border: 4px solid #c4c8cf; border-top-color: #2f6fde;
                     border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pdf { position: fixed; top: 16px; left: 16px; z-index: 5; box-shadow: 0 2px 8px rgba(0, 0, 0, .2); }
  #pdf:disabled { opacity: .7; cursor: default; }
  @media print {
    @page { margin: 0; }
    html, body { background: none; }
    #hint, #loading, #pdf { display: none !important; }
    .docx-wrapper { background: none !important; padding: 0 !important; display: block !important; }
    .docx-wrapper > section.docx { box-shadow: none !important; margin: 0 !important; break-after: page; }
  }
</style>
<style id="fonts"></style>
</head>
<body>
<div id="hint">
  <div id="msg">Перетащите .docx сюда</div>
  <button id="open">Открыть файл (Ctrl+O)</button>
</div>
<div id="loading" hidden></div>
<button id="pdf" hidden title="Экспорт в PDF">PDF</button>
<div id="doc"></div>
<input type="file" id="pick" accept=".docx" hidden>
<script src="jszip.min.js"></script>
<script src="docx-preview.min.js"></script>
<script>
  const $ = id => document.getElementById(id);

  function loading(name) {
    $('loading').textContent = name;
    $('loading').hidden = !name;
  }

  function fail(name, e) {
    loading(null);
    $('pdf').hidden = true;
    $('doc').innerHTML = '';
    $('hint').hidden = false;
    $('msg').textContent = 'Не удалось открыть ' + name + ': ' + e.message;
  }

  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const ctx = document.createElement('canvas').getContext('2d');
  const width = font => { ctx.font = '40px ' + font; return ctx.measureText('mmmwwwlliЖжы').width; };
  const installed = name => ['serif', 'monospace'].some(g => width(JSON.stringify(name) + ', ' + g) !== width(g));
  const generic = { roman: 'Times New Roman', modern: 'Courier New' };

  async function readXml(zip, path) {
    const f = zip.file(path);
    return f && new DOMParser().parseFromString(await f.async('string'), 'application/xml');
  }

  // Word falls back to w:altName or the font family for missing fonts, browsers fall back to Times
  function substituteFonts(table) {
    const css = [];
    for (const f of table ? table.getElementsByTagNameNS(W, 'font') : []) {
      const name = f.getAttributeNS(W, 'name');
      const val = tag => f.getElementsByTagNameNS(W, tag)[0]?.getAttributeNS(W, 'val');
      if (!name || installed(name)) continue;
      const alts = [val('altName'), generic[val('family')] || 'Arial'].filter(Boolean);
      const bold = /bold|semi|demi|black|heavy/i.test(name);
      const src = alts.flatMap(a => bold ? [a + ' Bold', a] : [a]).map(a => `local(${JSON.stringify(a)})`);
      css.push(`@font-face { font-family: ${JSON.stringify(name)}; src: ${src.join(', ')}; }`);
    }
    $('fonts').textContent = css.join('\n');
  }

  // docx-preview turns w:tblpPr into float + "distance from text" margins and ignores tblpX/tblpY
  function placeFloatingTables(xml) {
    const pos = [...xml.getElementsByTagNameNS(W, 'tblpPr')];
    const tables = [...$('doc').querySelectorAll('table')].filter(t => t.style.float === 'left');
    if (pos.length !== tables.length) return;
    tables.forEach((t, i) => {
      const a = n => pos[i].getAttributeNS(W, n);
      const page = t.closest('section'), ps = getComputedStyle(page), pr = page.getBoundingClientRect();
      const shift = (prop, current, target) => t.style[prop] = parseFloat(getComputedStyle(t)[prop]) + target - current + 'px';
      if (!a('tblpXSpec'))
        shift('marginLeft', t.getBoundingClientRect().left - pr.left,
          (+a('tblpX') || 0) / 15 + (a('horzAnchor') === 'page' ? 0 : parseFloat(ps.paddingLeft)));
      const v = a('vertAnchor');
      if (!a('tblpYSpec') && (v === 'page' || v === 'margin'))
        shift('marginTop', t.getBoundingClientRect().top - pr.top,
          (+a('tblpY') || 0) / 15 + (v === 'page' ? 0 : parseFloat(ps.paddingTop)));
    });
  }

  async function show(data, name) {
    loading(name);
    try {
      const zip = await JSZip.loadAsync(data);
      const [body, fonts] = await Promise.all([readXml(zip, 'word/document.xml'), readXml(zip, 'word/fontTable.xml')]);
      substituteFonts(fonts);
      const savedByWord = body?.getElementsByTagNameNS(W, 'lastRenderedPageBreak').length > 0;
      await docx.renderAsync(data, $('doc'), null,
        { experimental: true, ignoreLastRenderedPageBreak: !savedByWord, paginate: !savedByWord });
      await document.fonts.ready;
      if (body) placeFloatingTables(body);
      $('hint').hidden = true;
      $('pdf').hidden = false;
      loading(null);
      document.title = name + ' - DOCX Viewer';
      fileName = name;
    } catch (e) {
      fail(name, e);
    }
  }

  let fileName = '';
  $('pdf').onclick = () => {
    const page = document.querySelector('#doc section.docx');
    $('pdf').disabled = true;
    $('pdf').textContent = 'Сохраняю…';
    chrome.webview.postMessage(['pdf', fileName, parseFloat(page.style.width), parseFloat(page.style.minHeight)].join('\n'));
  };
  window.chrome?.webview?.addEventListener('message', e => {
    $('pdf').textContent = { saved: 'Сохранено', failed: 'Ошибка' }[e.data] || 'PDF';
    setTimeout(() => { $('pdf').textContent = 'PDF'; $('pdf').disabled = false; }, e.data == 'cancel' ? 0 : 2000);
  });

  $('open').onclick = () => $('pick').click();
  $('pick').onchange = e => e.target.files[0] && show(e.target.files[0], e.target.files[0].name);
  addEventListener('keydown', e => {
    if (e.ctrlKey && e.code === 'KeyO') { e.preventDefault(); $('pick').click(); }
    if (e.key === 'Escape') chrome.webview.postMessage('close');
  });
  addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
  addEventListener('dragleave', () => document.body.classList.remove('drag'));
  addEventListener('drop', e => {
    e.preventDefault();
    document.body.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (f) show(f, f.name);
  });

  const f = new URLSearchParams(location.search).get('f');
  if (f) {
    loading(f);
    fetch('https://doc.local/' + encodeURIComponent(f))
      .then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(b => show(b, f), e => fail(f, e));
  }
</script>
</body>
</html>
